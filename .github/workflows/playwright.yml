name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *' # nightly regression at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write # lets the JUnit summary step publish check results

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret default; override per-environment with a repository/environment variable.
  BASE_URL: ${{ vars.BASE_URL || 'https://rahulshettyacademy.com/client' }}

jobs:
  test:
    name: Playwright (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # splits the suite across two runners; increase as the suite grows
    env:
      CI: true
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p \"require('@playwright/test/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Publish JUnit summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          include_passed: true
          check_name: Playwright results (shard ${{ matrix.shard }})
        continue-on-error: true
